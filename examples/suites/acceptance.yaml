schemaVersion: 1
name: wfcheck-acceptance
tests:
  - id: correct
    workflow: ../workflows/correct.json
    fixture: ../fixtures/contact.json
    mocks:
      - id: crm
        method: POST
        path: /contacts
        responses:
          - kind: json
            status: 201
            json:
              id: fake-contact-1
    assertions:
      - target: execution.status
        equals: success
      - target: requests.count
        mockId: crm
        equals: 1
      - target: request.json
        mockId: crm
        requestIndex: 0
        pointer: /email
        equals: customer@example.test
      - target: node.count
        nodeId: map
        runIndex: 0
        outputIndex: 0
        equals: 1
      - target: node.json
        nodeId: map
        pointer: /email
        equals: customer@example.test
      - target: node.json
        nodeId: crm
        pointer: /id
        equals: fake-contact-1
  - id: missing-input
    workflow: ../workflows/correct.json
    fixture: ../fixtures/missing-email.json
    mocks:
      - id: crm
        method: POST
        path: /contacts
        responses:
          - kind: json
            status: 201
            json:
              id: fake-contact-1
    assertions:
      - target: execution.status
        equals: success
      - target: requests.count
        mockId: crm
        equals: 0
      - target: node.executed
        nodeId: crm
        equals: false
      - target: node.count
        nodeId: rejected
        runIndex: 0
        outputIndex: 0
        equals: 1
  - id: broken-filter
    workflow: ../workflows/broken-filter.json
    fixture: ../fixtures/contact.json
    mocks:
      - id: crm
        method: POST
        path: /contacts
        responses:
          - kind: json
            status: 201
            json:
              id: fake-contact-1
    assertions:
      - target: execution.status
        equals: success
      - target: node.count
        nodeId: filter
        runIndex: 0
        outputIndex: 0
        equals: 1
      - target: requests.count
        mockId: crm
        equals: 1
      - target: request.json
        mockId: crm
        requestIndex: 0
        pointer: /email
        equals: customer@example.test
  - id: retry-429
    workflow: ../workflows/retry.json
    fixture: ../fixtures/contact.json
    mocks:
      - id: crm
        method: POST
        path: /contacts
        responses:
          - kind: json
            status: 429
            json:
              error: rate limited
          - kind: json
            status: 201
            json:
              id: fake-contact-1
    assertions:
      - target: execution.status
        equals: success
      - target: requests.count
        mockId: crm
        equals: 2
      - target: request.json
        mockId: crm
        requestIndex: 0
        pointer: /email
        equals: customer@example.test
      - target: request.json
        mockId: crm
        requestIndex: 1
        pointer: /email
        equals: customer@example.test
  - id: error-path-500
    workflow: ../workflows/error-path.json
    fixture: ../fixtures/contact.json
    mocks:
      - id: crm
        method: POST
        path: /contacts
        responses:
          - kind: json
            status: 500
            json:
              error: fake upstream failure
    assertions:
      - target: execution.status
        equals: success
      - target: requests.count
        mockId: crm
        equals: 1
      - target: node.json
        nodeId: error-path
        pointer: /outcome
        equals: handled
  - id: delayed-timeout
    workflow: ../workflows/timeout.json
    fixture: ../fixtures/contact.json
    mocks:
      - id: crm
        method: POST
        path: /contacts
        responses:
          - kind: json
            status: 201
            json:
              id: fake-contact-1
            delayMs: 4000
    assertions:
      - target: execution.status
        equals: error
      - target: requests.count
        mockId: crm
        equals: 1
      - target: node.executed
        nodeId: crm
        equals: true
  - id: malformed-json
    workflow: ../workflows/correct.json
    fixture: ../fixtures/contact.json
    mocks:
      - id: crm
        method: POST
        path: /contacts
        responses:
          - kind: malformed-json
            status: 200
            text: "{invalid-json"
    assertions:
      - target: execution.status
        equals: error
      - target: requests.count
        mockId: crm
        equals: 1
      - target: node.executed
        nodeId: crm
        equals: true
  - id: text-response
    workflow: ../workflows/text.json
    fixture: ../fixtures/contact.json
    mocks:
      - id: crm
        method: POST
        path: /contacts
        responses:
          - kind: text
            status: 200
            text: hello synthetic world
    assertions:
      - target: execution.status
        equals: success
      - target: requests.count
        mockId: crm
        equals: 1
      - target: node.json
        nodeId: crm
        pointer: /data
        equals: hello synthetic world
